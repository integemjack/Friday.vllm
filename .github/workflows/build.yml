# 打包 Windows（单个 exe）和 Mac（.app，Apple 芯片）并自检。推 vX.Y.Z 标签时先建 Release，两个包直接传上去；
# 平时 push 只打包、自检（不传 Artifact：账号的 Artifact 存储额度常常用满）。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Friday vLLM ${GITHUB_REF_NAME#v}" \
            --notes "Windows：解压后双击 FridayVLLM.exe。Mac（Apple 芯片）：解压后把 Friday vLLM.app 拖进「应用程序」；没签名，第一次打开要在「系统设置 › 隐私与安全性」里点「仍要打开」。"

  build:
    name: ${{ matrix.target }}
    needs: release
    # 不是标签时 release 被跳过，照样打包
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 打包
        run: pyinstaller --noconfirm friday_vllm.spec
      - name: 自检（打包后的程序建得起界面、带着 agent.py）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then program=dist/FridayVLLM.exe; else program="dist/Friday vLLM.app/Contents/MacOS/Friday vLLM"; fi
          "$program" --selftest selftest.txt
          cat selftest.txt
          grep -q '^ok' selftest.txt
      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from friday_vllm import __version__; print(__version__)"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/FridayVLLM.exe -DestinationPath "out/FridayVLLM-$version-windows-x64.zip"
      - name: 压缩（Mac）
        if: runner.os == 'macOS'
        run: |
          version=$(python -c "from friday_vllm import __version__; print(__version__)")
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "dist/Friday vLLM.app" "out/FridayVLLM-$version-macos-arm64.zip"
      - name: 传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
